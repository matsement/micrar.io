<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micrar.io - Unpredictable Microbe Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: Arial, sans-serif; overflow: hidden; background-color: #0b1230; color: #e6eef6; }
        canvas { display: block; }

        #startScreen, #summaryScreen { position: absolute; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 30px; }
        .card { max-width: 880px; width: 100%; background: rgba(8,8,12,0.96); border-radius: 16px; padding: 28px 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.03); color: #e6eef6; }
        .card h1 { font-size: clamp(20px, 2.8vw, 32px); margin-bottom: 12px; color: #fff; text-align: center; }
        .actions { margin-top: 20px; display:flex; justify-content:center; gap:10px; }
        button { padding: 10px 16px; border-radius: 8px; background: #22c7a6; border: none; font-weight: 700; color: #061510; cursor: pointer; }
        .hidden { display: none !important; }

        #startHint { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 400; font-weight:700; color:#dfeff6; background: rgba(0,0,0,0.28); padding:8px 12px; border-radius:8px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen">
        <div class="card">
            <h1>Can you design with something you cannot command?</h1>
            <div class="actions"><button id="startBtn">Start</button></div>
        </div>
    </div>

    <div id="summaryScreen" class="hidden">
        <div class="card">
            <h1>They went where they went.</h1>
            <div class="actions"><button id="tryAgainBtn">Try again</button></div>
        </div>
    </div>

    <div id="startHint" class="hidden">Guide them.</div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    const startHint = document.getElementById('startHint');
    const microbeTypes = ['spiky','rod','coccus','flagella'];

    let running = false;
    let ended = false;
    let gameStartTime = 0;
    let lastTime = Date.now();

    const cursor = { x: canvas.width / 2, y: canvas.height / 2 };
    const pulses = [];
    const microbes = [];

    const zone = { x: canvas.width / 2, y: canvas.height / 2, radius: 92 };

    function dayNightFactor(){
        return (Date.now() % 30000) / 30000;
    }

    function randomMicrobeType(){
        return microbeTypes[Math.floor(Math.random() * microbeTypes.length)];
    }

    function randColor(){
        const palette = ['#9fffcf','#ffd8a8','#c8baff','#a8e7ff','#ffd1e6'];
        return palette[Math.floor(Math.random() * palette.length)];
    }

    function createMicrobe(x, y){
        const radius = 8 + Math.random() * 22;
        const angle = Math.random() * Math.PI * 2;
        return {
            id: Math.random().toString(36).slice(2, 9),
            x: x || Math.random() * canvas.width,
            y: y || Math.random() * canvas.height,
            radius,
            type: randomMicrobeType(),
            color: randColor(),
            opacity: 0.8 + Math.random() * 0.2,
            baseSpeed: 0.5 + Math.random() * 0.9,
            direction: { x: Math.cos(angle), y: Math.sin(angle) },
            motilityState: 'run',
            runTimer: 0.6 + Math.random() * 1.6,
            tumbleTimer: 0,
            rhythmPhase: Math.random() * Math.PI * 2,
            communicationRadius: 60 + Math.random() * 80,
            responseProb: 0.2 + Math.random() * 0.2,
            responseMode: (function(){
                const r = Math.random();
                if(r < 0.5) return 'attract';
                if(r < 0.7) return 'nightOnly';
                if(r < 0.85) return 'repel';
                return 'ignore';
            })(),
            individuality: Math.random()
        };
    }

    function createPopulation(count){
        microbes.length = 0;
        for(let i = 0; i < count; i++){
            microbes.push(createMicrobe());
        }
    }

    function ensureZonePosition(){
        zone.x = canvas.width / 2;
        zone.y = canvas.height / 2;
    }

    function drawMicrobe(targetCtx, x, y, r, type, color, opacity){
        targetCtx.save();
        targetCtx.translate(x, y);
        targetCtx.globalAlpha = opacity;
        const phase = (x + y + Date.now() / 140) % 1000;

        if(type === 'spiky'){
            const points = 10 + Math.floor(r / 3);
            targetCtx.fillStyle = color;
            targetCtx.beginPath();
            for(let i = 0; i < points; i++){
                const a = (i / points) * Math.PI * 2;
                const wobble = Math.sin(a * 3 + phase * 0.01) * 0.1;
                const rad = r * (0.8 + wobble);
                const px = Math.cos(a) * rad;
                const py = Math.sin(a) * rad;
                if(i === 0) targetCtx.moveTo(px, py); else targetCtx.lineTo(px, py);
            }
            targetCtx.closePath();
            targetCtx.fill();
        } else if(type === 'rod'){
            targetCtx.fillStyle = color;
            targetCtx.beginPath();
            const len = r * 2.0;
            targetCtx.ellipse(0, 0, len, r * 0.9, 0, 0, Math.PI * 2);
            targetCtx.fill();
        } else if(type === 'coccus'){
            targetCtx.fillStyle = color;
            const count = 3 + Math.floor(r / 6);
            for(let i = 0; i < count; i++){
                const a = (i / count) * Math.PI * 2 + Math.sin(phase * 0.01 + i) * 0.2;
                const rr = r * (0.35 + Math.random() * 0.35);
                targetCtx.beginPath();
                targetCtx.arc(Math.cos(a) * r * 0.25, Math.sin(a) * r * 0.25, rr, 0, Math.PI * 2);
                targetCtx.fill();
            }
        } else if(type === 'flagella'){
            targetCtx.fillStyle = color;
            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, r * 0.9, r * 0.7, 0, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.strokeStyle = color;
            targetCtx.lineWidth = Math.max(1, r * 0.04);
            targetCtx.beginPath();
            targetCtx.moveTo(-r * 0.8, 0);
            targetCtx.quadraticCurveTo(-r * 1.6, -r * 0.8, -r * 2.5, -r * 0.2);
            targetCtx.stroke();
        } else {
            targetCtx.fillStyle = color;
            targetCtx.beginPath();
            targetCtx.arc(0, 0, r, 0, Math.PI * 2);
            targetCtx.fill();
        }

        targetCtx.restore();
    }

    function drawBackground(){
        const dn = dayNightFactor();
        const dayColor1 = { r: 30, g: 60, b: 114 };
        const dayColor2 = { r: 42, g: 82, b: 152 };
        const nightColor1 = { r: 4, g: 8, b: 24 };
        const nightColor2 = { r: 10, g: 12, b: 28 };
        const t = (Math.sin(dn * Math.PI * 2) * 0.5 + 0.5);
        function lerp(a, b, t){ return Math.round(a + (b - a) * t); }
        const c1 = `rgb(${lerp(nightColor1.r, dayColor1.r, t)},${lerp(nightColor1.g, dayColor1.g, t)},${lerp(nightColor1.b, dayColor1.b, t)})`;
        const c2 = `rgb(${lerp(nightColor2.r, dayColor2.r, t)},${lerp(nightColor2.g, dayColor2.g, t)},${lerp(nightColor2.b, dayColor2.b, t)})`;
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawZone(){
        ctx.save();
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = '#00ffb0';
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = '#9effd7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    function drawPulses(){
        const now = Date.now();
        for(const p of pulses){
            const elapsed = (now - p.started) / 1000;
            const t = Math.min(1, Math.max(0, elapsed / p.duration));
            const radius = t * p.maxRadius;
            ctx.save();
            ctx.globalAlpha = 0.9 * (1 - t);
            ctx.strokeStyle = `rgba(160, 240, 200, ${0.85 * (1 - t)})`;
            ctx.lineWidth = 3 + 3 * (1 - t);
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawMicrobes(){
        for(const e of microbes){
            drawMicrobe(ctx, e.x, e.y, e.radius, e.type, e.color, e.opacity);
        }
    }

    function drawCursor(){
        ctx.save();
        ctx.translate(cursor.x, cursor.y);
        ctx.strokeStyle = 'rgba(230, 245, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10);
        ctx.stroke();
        ctx.restore();
    }

    function updateMicrobe(e, dt){
        if(e.motilityState === 'run'){
            e.runTimer -= dt;
            if(e.runTimer <= 0){
                e.motilityState = 'tumble';
                e.tumbleTimer = 0.08 + Math.random() * 0.28;
                const a = Math.random() * Math.PI * 2;
                e.direction.x = Math.cos(a);
                e.direction.y = Math.sin(a);
            }
        } else {
            e.tumbleTimer -= dt;
            if(e.tumbleTimer <= 0){
                e.motilityState = 'run';
                e.runTimer = 0.6 + Math.random() * 1.4;
                const a = Math.random() * Math.PI * 2;
                e.direction.x = Math.cos(a);
                e.direction.y = Math.sin(a);
            }
        }

        const dn = dayNightFactor();
        const night = (dn < 0.25 || dn > 0.75);

        let desired = { x: e.direction.x, y: e.direction.y };

        let comm = { x: 0, y: 0 };
        let nearby = 0;
        for(const o of microbes){
            if(o === e) continue;
            const dx = o.x - e.x;
            const dy = o.y - e.y;
            const dist = Math.hypot(dx, dy);
            if(dist > 0 && dist < e.communicationRadius){
                comm.x += (dx / dist) * 0.02;
                comm.y += (dy / dist) * 0.02;
                nearby++;
            }
        }
        if(nearby > 0){
            desired.x += comm.x;
            desired.y += comm.y;
        }

        let pulseInfluence = { x: 0, y: 0 };
        const now = Date.now();
        for(const p of pulses){
            const elapsed = (now - p.started) / 1000;
            if(elapsed < 0 || elapsed > p.duration) continue;

            const dx = p.x - e.x;
            const dy = p.y - e.y;
            const dist = Math.hypot(dx, dy) || 0.0001;
            const pulseRadius = elapsed / p.duration * p.maxRadius;
            if(dist > pulseRadius + 30) continue;

            const willRespond = Math.random() < e.responseProb;
            if(!willRespond) continue;

            if(e.responseMode === 'ignore') continue;
            if(e.responseMode === 'nightOnly' && !night) continue;

            const nx = dx / dist;
            const ny = dy / dist;
            const proximity = Math.max(0, 1 - (dist / Math.max(20, pulseRadius + 1)));
            const phaseFactor = 1 - (elapsed / p.duration);
            const strength = (0.14 + e.individuality * 0.1) * proximity * phaseFactor;

            if(e.responseMode === 'repel'){
                pulseInfluence.x -= nx * strength;
                pulseInfluence.y -= ny * strength;
            } else {
                pulseInfluence.x += nx * strength;
                pulseInfluence.y += ny * strength;
            }
        }

        desired.x += pulseInfluence.x * 0.8 + (Math.random() - 0.5) * 0.14;
        desired.y += pulseInfluence.y * 0.8 + (Math.random() - 0.5) * 0.14;

        const mag = Math.hypot(desired.x, desired.y) || 1;
        desired.x /= mag;
        desired.y /= mag;

        const rhythm = Math.sin(e.rhythmPhase + dn * Math.PI * 2);
        e.rhythmPhase += dt * (0.7 + dn * 1.2);
        const speed = Math.max(0.1, e.baseSpeed * (0.6 + 0.9 * (1 - Math.abs(0.5 - dn) * 2)) + Math.abs(rhythm) * 0.12);

        const moveScale = e.motilityState === 'run' ? 1 : 0.34;
        e.x += desired.x * speed * moveScale;
        e.y += desired.y * speed * moveScale;

        if(e.x - e.radius < 0){ e.x = e.radius; e.direction.x *= -1; }
        if(e.x + e.radius > canvas.width){ e.x = canvas.width - e.radius; e.direction.x *= -1; }
        if(e.y - e.radius < 0){ e.y = e.radius; e.direction.y *= -1; }
        if(e.y + e.radius > canvas.height){ e.y = canvas.height - e.radius; e.direction.y *= -1; }
    }

    function update(dt){
        if(!running || ended) return;

        const now = Date.now();
        for(let i = pulses.length - 1; i >= 0; i--){
            if(now - pulses[i].started > pulses[i].duration * 1000){
                pulses.splice(i, 1);
            }
        }

        for(const e of microbes){
            updateMicrobe(e, dt);
        }

        let inZone = 0;
        for(const e of microbes){
            const dx = e.x - zone.x;
            const dy = e.y - zone.y;
            const dist = Math.hypot(dx, dy);
            if(dist <= zone.radius + e.radius * 0.6){
                inZone++;
            }
        }

        if(inZone >= 10){
            // The objective is real, but the game still ends on the timer. This keeps the goal meaningful without creating a modal win state.
        }

        if((Date.now() - gameStartTime) >= 60000){
            endGame();
        }
    }

    function draw(){
        drawBackground();
        drawPulses();
        drawZone();
        drawMicrobes();
        drawCursor();

        if(running && !ended){
            startHint.classList.remove('hidden');
        } else {
            startHint.classList.add('hidden');
        }
    }

    function startGame(){
        running = true;
        ended = false;
        gameStartTime = Date.now();
        pulses.length = 0;
        createPopulation(40);
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('summaryScreen').classList.add('hidden');
        startHint.classList.remove('hidden');
    }

    function endGame(){
        if(ended) return;
        ended = true;
        running = false;
        document.getElementById('summaryScreen').classList.remove('hidden');
        startHint.classList.add('hidden');
    }

    window.addEventListener('mousemove', (event) => {
        cursor.x = event.clientX;
        cursor.y = event.clientY;
    });

    window.addEventListener('mousedown', () => {
        if(!running) return;
        pulses.push({
            x: cursor.x,
            y: cursor.y,
            started: Date.now(),
            duration: 2,
            maxRadius: 360
        });
    });

    window.addEventListener('pointerdown', () => {
        if(!running) return;
        pulses.push({
            x: cursor.x,
            y: cursor.y,
            started: Date.now(),
            duration: 2,
            maxRadius: 360
        });
    });

    window.addEventListener('pointermove', (event) => {
        cursor.x = event.clientX;
        cursor.y = event.clientY;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('tryAgainBtn').addEventListener('click', () => {
        document.getElementById('startScreen').classList.remove('hidden');
        document.getElementById('summaryScreen').classList.add('hidden');
        startHint.classList.add('hidden');
    });

    function loop(){
        const now = Date.now();
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => {
        resize();
        ensureZonePosition();
    });

    ensureZonePosition();
    createPopulation(40);
    requestAnimationFrame(loop);
    </script>
</body>
</html>
