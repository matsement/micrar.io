<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micrar.io - Unpredictable Microbe Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: Arial, sans-serif; overflow: hidden; background-color: #0b1230; color: #e6eef6; }
        canvas { display: block; }

        #hud {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 550;
            display:flex;
            align-items:center;
            gap:14px;
            background: rgba(0,0,0,0.18);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            color: #e8f6f0;
            font-weight:700;
            backdrop-filter: blur(4px);
        }
        #counter { font-size: 20px; letter-spacing:0.6px; }
        #timer { font-size: 16px; opacity:0.9; font-weight:800; color:#cfeef0; }

        #startScreen, #summaryScreen { position: absolute; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 30px; }
        .card { max-width: 680px; width: 100%; background: rgba(8,8,12,0.96); border-radius: 16px; padding: 28px 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.04); }
        .card h1 { font-size: clamp(20px, 2.8vw, 32px); margin-bottom: 12px; color: #fff; }
        .card p { color: #dfeff6; margin-bottom: 18px; font-weight:600; }
        .actions { margin-top: 10px; display:flex; justify-content:center; gap:10px; }
        button { padding: 10px 16px; border-radius: 8px; background: #22c7a6; border: none; font-weight: 700; color: #061510; cursor: pointer; }
        .hidden { display: none !important; }

        #startHint { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 400; font-weight:700; color:#dfeff6; background: rgba(0,0,0,0.28); padding:8px 12px; border-radius:10px; }

        @media (max-width:520px){
            #hud { gap:8px; padding:6px 8px; }
            #counter { font-size:16px; }
            #timer { font-size:13px; }
            .card { padding:20px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" aria-hidden="true">
        <div id="counter">0 / 10</div>
        <div id="timer">45</div>
    </div>

    <div id="startScreen">
        <div class="card">
            <h1>Can you design with something you cannot command?</h1>
            <p>Get 10 microbes inside the circle. Click to collect them.</p>
            <div class="actions"><button id="startBtn">Start</button></div>
        </div>
    </div>

    <div id="summaryScreen" class="hidden">
        <div class="card">
            <h1>They went where they went.</h1>
            <p id="closestLine">Closest: 0 of 10</p>
            <div class="actions"><button id="tryAgainBtn">Try again</button></div>
        </div>
    </div>

    <div id="startHint" class="hidden">Guide them.</div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    const HUD = {
        counterEl: document.getElementById('counter'),
        timerEl: document.getElementById('timer'),
    };

    const startHint = document.getElementById('startHint');
    const microbeTypes = ['bacillus','coccus','spirillum','vibrio','flagellate','ciliate'];

    let running = false;
    let ended = false;
    let gameStartTime = 0;
    let lastTime = Date.now();

    const cursor = { x: canvas.width / 2, y: canvas.height / 2 };
    const pulses = [];
    const microbes = [];

    const zone = { x: canvas.width / 2, y: canvas.height / 2, radius: 96 };

    // ----- GAME & TUNING CONSTANTS (easy to tweak) -----
    const GOAL = 10;
    const GAME_DURATION = 45 * 1000;

    // Control timeline (seconds)
    const CONTROL_HOLD_SEC = 20;          // hold control at 1.0 until this many seconds
    const CONTROL_FADE_TO_SEC = 30;       // control fades to mid value by this second
    const CONTROL_END_SEC = 45;           // control reaches near-zero at this second

    // Control target values
    const CONTROL_FULL = 1.0;
    const CONTROL_MID = 0.55;
    const CONTROL_LOW = 0.05;

    // Pulse tuning
    const PULSE_MAX_RADIUS = 480;
    const PULSE_DURATION = 2.2; // seconds
    const PULSE_INTERVAL_MS = 300; // click-and-hold interval
    const PULSE_STRENGTH_MULT = 1.3; // extra multiplier to make microbes respond faster

    // Response probabilities & stickiness
    const RESPONSE_PROB_BASE = 0.9; // about 0.9 when control==1
    const STICKY_SPEED_MULT = 0.30; // speed multiplier when sticky (30%)
    const STICKY_TUMBLE_REDUCTION = 0.6; // reduce tumble frequency when sticky (scale)
    const STICKY_PULL_BASE = 0.6; // base pull toward centre when sticky (scales with control)

    // Guarantee/help timings
    const GUARANTEE_NINE_TIME_MS = 26000; // ~26s: if player hasn't hit 9 by this time, boost them
    const FIRST_CLICK_BOOST_MS = 1400; // first click temporary boost
    const BOOST_AFTER_TIMEOUT_MS = 5000; // how long the temporary "help" lasts when boosting

    // Betrayal timings
    const TEN_RESPONSE_DELAY_MIN = 300; // milliseconds before one/two microbes suddenly leave after 10th enters
    const TEN_RESPONSE_DELAY_MAX = 600;
    const BETRAY_IGNORE_MIN_MS = 4000; // microbes leaving ignore pulses 4-6s
    const BETRAY_IGNORE_MAX_MS = 6000;
    const HOLD_AT_NINE_MIN_MS = 1000; // hold 1-2s when count reaches 9
    const HOLD_AT_NINE_MAX_MS = 2000;
    const LATER_BETRAY_MIN_DELAY_MS = 500; // 0.5 - 1.5s for later betrayals
    const LATER_BETRAY_MAX_DELAY_MS = 1500;

    // Last-phase weakening
    const LAST_PHASE_START = GAME_DURATION - 12 * 1000;

    // ---------------------------------------------------

    let highestCount = 0;
    let betrayalScheduledAt = 0;
    let lastBetrayalTime = 0;
    let reachedNineAt = 0;
    let reachedNineOnce = false;
    let firstClickBoostUntil = 0;
    let pointerDown = false;
    let pointerPulseInterval = null;
    let helpBoostUntil = 0;

    const particles = [];
    for(let i=0;i<80;i++){
        particles.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            vx: (Math.random()-0.5)*0.05,
            vy: (Math.random()-0.5)*0.05,
            size: 0.5 + Math.random()*1.8,
            alpha: 0.04 + Math.random()*0.12
        });
    }

    function dayNightFactor(){
        return (Date.now() % 30000) / 30000;
    }

    function randomMicrobeType(){
        return microbeTypes[Math.floor(Math.random() * microbeTypes.length)];
    }

    function randColor(){
        const palette = ['rgba(160,250,200,0.78)','rgba(255,215,160,0.78)','rgba(200,185,255,0.78)','rgba(168,231,255,0.78)','rgba(255,209,230,0.78)'];
        return palette[Math.floor(Math.random() * palette.length)];
    }

    function chooseCoord(v, fallback){
        return (typeof v === 'number') ? v : fallback();
    }

    function createMicrobe(x, y){
        const px = chooseCoord(x, () => Math.random() * canvas.width);
        const py = chooseCoord(y, () => Math.random() * canvas.height);

        const baseRadius = 6 + Math.random()*10;
        const bodyScale = 0.7 + Math.random() * 0.7;
        const radius = baseRadius * bodyScale;

        const angle = Math.random() * Math.PI * 2;
        const type = randomMicrobeType();
        const wobblePhase = Math.random() * Math.PI * 2;
        const organelles = [];
        const organelleCount = 2 + Math.floor(Math.random()*4);
        for(let i=0;i<organelleCount;i++){
            organelles.push({
                ax: (Math.random()*1.6 - 0.8) * radius,
                ay: (Math.random()*1.6 - 0.8) * radius,
                r: Math.max(1, Math.random()*radius*0.38)
            });
        }
        const color = randColor();
        const membraneTint = 'rgba(255,255,255,0.08)';
        const flagellaCount = (type === 'flagellate') ? (Math.random() < 0.6 ? 1 : 2) : 0;
        const spiralParams = {
            amplitude: 1 + Math.random()*1.4,
            wavelength: 8 + Math.random()*10,
            phaseOffset: Math.random()*Math.PI*2
        };
        const ciliaDensity = (type === 'ciliate') ? (8 + Math.floor(Math.random()*18)) : 0;
        const chainPartner = (type === 'bacillus' && Math.random() < 0.18);

        return {
            id: Math.random().toString(36).slice(2, 9),
            x: px,
            y: py,
            radius,
            type,
            color,
            membraneTint,
            opacity: 0.78 + Math.random()*0.18,
            baseSpeed: 0.7 + Math.random() * 1.0,
            direction: { x: Math.cos(angle), y: Math.sin(angle) },
            motilityState: 'run',
            runTimer: 0.6 + Math.random() * 1.6,
            tumbleTimer: 0,
            rhythmPhase: Math.random() * Math.PI * 2,
            communicationRadius: 95 + Math.random() * 120,
            // per-microbe baseline response probability (will be scaled by global control)
            responseProbBase: 0.6 + Math.random() * 0.18,
            responseMode: (function(){
                const r = Math.random();
                if(r < 0.6) return 'attract';
                if(r < 0.82) return 'nightOnly';
                if(r < 0.92) return 'repel';
                return 'ignore';
            })(),
            individuality: Math.random(),
            wobblePhase,
            organelles,
            flagellaCount,
            spiralParams,
            ciliaDensity,
            chainPartner,
            bodyScale,
            lastRespondedAt: 0,
            stickyUntil: 0,
            stickyStrength: 0,
            ignorePulsesUntil: 0,
            speedBurstUntil: 0,
            lastLeftZoneAt: 0,
            modeAssignedAt: 0 // timestamp when responseMode was last (re)assigned
        };
    }

    function createPopulation(count){
        microbes.length = 0;
        for(let i = 0; i < count; i++){
            microbes.push(createMicrobe());
        }
    }

    function ensureZonePosition(){
        zone.x = canvas.width / 2;
        zone.y = canvas.height / 2;
    }

    function drawBackground(){
        const dn = dayNightFactor();
        const dayColor1 = { r: 30, g: 60, b: 114 };
        const dayColor2 = { r: 42, g: 82, b: 152 };
        const nightColor1 = { r: 4, g: 8, b: 24 };
        const nightColor2 = { r: 10, g: 12, b: 28 };
        const t = (Math.sin(dn * Math.PI * 2) * 0.5 + 0.5);
        function lerp(a, b, t){ return Math.round(a + (b - a) * t); }
        const c1 = `rgb(${lerp(nightColor1.r, dayColor1.r, t)},${lerp(nightColor1.g, dayColor1.g, t)},${lerp(nightColor1.b, dayColor1.b, t)})`;
        const c2 = `rgb(${lerp(nightColor2.r, dayColor2.r, t)},${lerp(nightColor2.g, dayColor2.g, t)},${lerp(nightColor2.b, dayColor2.b, t)})`;
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, Math.min(canvas.width, canvas.height)*0.2, canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)*0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.45)');
        ctx.fillStyle = vg;
        ctx.fillRect(0,0,canvas.width,canvas.height);

        for(const p of particles){
            p.x += p.vx;
            p.y += p.vy;
            if(p.x < -10) p.x = canvas.width + 10;
            if(p.x > canvas.width + 10) p.x = -10;
            if(p.y < -10) p.y = canvas.height + 10;
            if(p.y > canvas.height + 10) p.y = -10;
            ctx.fillStyle = `rgba(200,230,210,${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.006)';
        for(let i=0;i<60;i++){
            const gx = (i*73 + Date.now()*0.02) % canvas.width;
            const gy = (i*37 + Date.now()*0.01) % canvas.height;
            ctx.fillRect(gx, gy, 1, 1);
        }
    }

    function drawZone(inZone){
        const pulseBase = 0.9 + 0.2 * Math.sin(Date.now() * 0.004);
        const progressBoost = 1 + (inZone / GOAL) * 1.6;
        const outerAlpha = 0.12 * pulseBase * progressBoost;
        const innerAlpha = 0.22 * pulseBase * progressBoost;

        ctx.save();
        const halo = ctx.createRadialGradient(zone.x, zone.y, zone.radius*0.2, zone.x, zone.y, zone.radius*2.2);
        halo.addColorStop(0, `rgba(0,255,176,${innerAlpha})`);
        halo.addColorStop(1, `rgba(0,255,176,0)`);
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius * 2.2, 0, Math.PI*2);
        ctx.fill();

        ctx.globalAlpha = 0.06 * progressBoost;
        ctx.fillStyle = '#00ffb0';
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = outerAlpha;
        ctx.strokeStyle = '#9effd7';
        ctx.lineWidth = 3 + 3 * Math.sin(Date.now() * 0.006);
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    function drawMicrobe(targetCtx, e, now){
        targetCtx.save();
        targetCtx.translate(e.x, e.y);
        const angle = Math.atan2(e.direction.y, e.direction.x);
        if(typeof e.drawAngle !== 'number') e.drawAngle = angle;
        const da = angle - e.drawAngle;
        const wrapped = ((da + Math.PI) % (Math.PI*2)) - Math.PI;
        e.drawAngle += wrapped * 0.18;
        targetCtx.rotate(e.drawAngle);

        const r = e.radius;
        const opacity = e.opacity;
        const grad = targetCtx.createRadialGradient(-r*0.25, -r*0.25, r*0.1, 0, 0, r*1.05);
        grad.addColorStop(0, 'rgba(30,30,36,0.9)');
        grad.addColorStop(0.5, e.color);
        grad.addColorStop(1, 'rgba(10,10,14,0.06)');

        targetCtx.globalAlpha = opacity;

        if(e.type === 'bacillus'){
            const len = r * (1.8 + (e.chainPartner ? 0.9 : 0));
            targetCtx.fillStyle = grad;
            targetCtx.beginPath();
            targetCtx.moveTo(-len/2 + r, -r);
            targetCtx.arc(-len/2 + r, 0, r, -Math.PI/2, Math.PI/2);
            targetCtx.lineTo(len/2 - r, r);
            targetCtx.arc(len/2 - r, 0, r, Math.PI/2, -Math.PI/2);
            targetCtx.closePath();
            targetCtx.fill();

            targetCtx.strokeStyle = e.membraneTint;
            targetCtx.lineWidth = Math.max(1, r*0.13);
            targetCtx.stroke();

            targetCtx.fillStyle = 'rgba(20,30,20,0.55)';
            for(const o of e.organelles){
                targetCtx.beginPath();
                targetCtx.ellipse(o.ax, o.ay, o.r*0.9, o.r*0.7, 0, 0, Math.PI*2);
                targetCtx.fill();
            }
            if(e.chainPartner){
                targetCtx.translate(len*0.6, 0);
                targetCtx.fillStyle = grad;
                targetCtx.beginPath();
                targetCtx.moveTo(-len/4 + r*0.6, -r*0.78);
                targetCtx.arc(-len/4 + r*0.6, 0, r*0.6, -Math.PI/2, Math.PI/2);
                targetCtx.lineTo(len/4 - r*0.6, r*0.6);
                targetCtx.arc(len/4 - r*0.6, 0, r*0.6, Math.PI/2, -Math.PI/2);
                targetCtx.closePath();
                targetCtx.fill();
            }
        } else if(e.type === 'coccus'){
            const count = 2 + Math.floor((r/6) + (e.bodyScale*1.2));
            const spacing = r * 0.9;
            const positions = [];
            for(let i=0;i<count;i++){
                const a = (i / count) * Math.PI * 2 + e.wobblePhase;
                const px = Math.cos(a) * spacing * 0.6;
                const py = Math.sin(a) * spacing * 0.18;
                positions.push([px, py]);
            }
            targetCtx.fillStyle = grad;
            for(const p of positions){
                targetCtx.beginPath();
                targetCtx.arc(p[0], p[1], r*0.62, 0, Math.PI*2);
                targetCtx.fill();
                targetCtx.strokeStyle = e.membraneTint;
                targetCtx.lineWidth = Math.max(0.7, r*0.06);
                targetCtx.stroke();
            }
            targetCtx.fillStyle = 'rgba(12,18,14,0.6)';
            for(const p of positions.slice(0, Math.min(3, positions.length))){
                targetCtx.beginPath();
                targetCtx.arc(p[0]*0.5, p[1]*0.4, r*0.16, 0, Math.PI*2);
                targetCtx.fill();
            }
        } else if(e.type === 'spirillum'){
            const length = r * 3.0;
            const steps = 14;
            const amp = e.spiralParams.amplitude * (r * 0.22);
            const wave = (now*0.002)*0.9 + e.spiralParams.phaseOffset;
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';
            targetCtx.strokeStyle = e.color;
            targetCtx.lineWidth = Math.max(2, r*0.9);
            targetCtx.beginPath();
            for(let i=0;i<=steps;i++){
                const t = i/steps;
                const x = -length/2 + t*length;
                const y = Math.sin(t * Math.PI * 2 * (length / e.spiralParams.wavelength) + wave) * amp;
                if(i===0) targetCtx.moveTo(x,y); else targetCtx.lineTo(x,y);
            }
            targetCtx.stroke();
            targetCtx.strokeStyle = 'rgba(8,14,10,0.6)';
            targetCtx.lineWidth = Math.max(0.6, r*0.26);
            targetCtx.beginPath();
            for(let i=0;i<=steps;i++){
                const t = i/steps;
                const x = -length/2 + t*length;
                const y = Math.sin(t * Math.PI * 2 * (length / e.spiralParams.wavelength) + wave) * amp * 0.45;
                if(i===0) targetCtx.moveTo(x,y); else targetCtx.lineTo(x,y);
            }
            targetCtx.stroke();
        } else if(e.type === 'vibrio'){
            targetCtx.fillStyle = grad;
            targetCtx.beginPath();
            const len = r * 1.9;
            targetCtx.ellipse(-len*0.08, 0, len, r*0.92, -0.28, 0, Math.PI*2);
            targetCtx.fill();
            targetCtx.strokeStyle = e.membraneTint;
            targetCtx.lineWidth = Math.max(0.9, r*0.1);
            targetCtx.stroke();

            targetCtx.strokeStyle = 'rgba(255,255,255,0.06)';
            targetCtx.lineWidth = Math.max(0.6, r*0.06);
            targetCtx.beginPath();
            targetCtx.moveTo(len*0.3, -r*0.2);
            targetCtx.quadraticCurveTo(len*0.8, 0, len*0.4, r*0.5);
            targetCtx.stroke();

            targetCtx.fillStyle = 'rgba(12,18,14,0.58)';
            for(const o of e.organelles){
                targetCtx.beginPath();
                targetCtx.ellipse(o.ax*0.5, o.ay*0.4, o.r*0.9, o.r*0.7, 0, 0, Math.PI*2);
                targetCtx.fill();
            }
        } else if(e.type === 'flagellate'){
            targetCtx.fillStyle = grad;
            targetCtx.beginPath();
            targetCtx.ellipse(0,0, r*1.0, r*0.72, 0, 0, Math.PI*2);
            targetCtx.fill();
            targetCtx.strokeStyle = e.membraneTint;
            targetCtx.lineWidth = Math.max(0.8, r*0.09);
            targetCtx.stroke();

            const speedFactor = Math.min(2.2, 0.6 + Math.hypot(e.direction.x, e.direction.y) * 0.9 + (e.baseSpeed*0.2));
            for(let f=0; f<e.flagellaCount; f++){
                const phase = e.wobblePhase + f*1.9;
                const waveSpeed = 0.008 * speedFactor;
                const length = r*3.2;
                targetCtx.strokeStyle = 'rgba(160,200,190,0.48)';
                targetCtx.lineWidth = Math.max(1, r*0.12);
                targetCtx.beginPath();
                for(let i=0;i<=28;i++){
                    const t = i/28;
                    const x = -r*0.4 + t*length;
                    const y = Math.sin(t*6 + now*waveSpeed + phase) * (r*0.25) * (1 + 0.4*Math.sin(now*0.002 + phase));
                    if(i===0) targetCtx.moveTo(x,y); else targetCtx.lineTo(x,y);
                }
                targetCtx.stroke();
            }

            targetCtx.fillStyle = 'rgba(18,20,22,0.62)';
            targetCtx.beginPath();
            targetCtx.ellipse(-r*0.14, 0, r*0.36, r*0.28, -0.14, 0, Math.PI*2);
            targetCtx.fill();
        } else if(e.type === 'ciliate'){
            const len = r*2.1;
            targetCtx.fillStyle = grad;
            targetCtx.beginPath();
            targetCtx.moveTo(-len/2 + r*0.6, -r*0.9);
            targetCtx.quadraticCurveTo(len/2, -r*0.9, len/2, 0);
            targetCtx.quadraticCurveTo(len/2, r*0.9, -len/2 + r*0.6, r*0.9);
            targetCtx.arc(-len/2 + r*0.6, 0, r*0.9, Math.PI/2, -Math.PI/2, true);
            targetCtx.closePath();
            targetCtx.fill();

            targetCtx.strokeStyle = e.membraneTint;
            targetCtx.lineWidth = Math.max(0.8, r*0.08);
            targetCtx.stroke();

            const wave = Math.sin(now*0.007 + e.wobblePhase) * 0.8;
            targetCtx.strokeStyle = 'rgba(220,240,230,0.18)';
            targetCtx.lineWidth = Math.max(0.6, r*0.06);
            for(let i=0;i<e.ciliaDensity;i++){
                const a = (i / e.ciliaDensity) * Math.PI * 2;
                const px = Math.cos(a) * r * 1.1;
                const py = Math.sin(a) * r * 0.9;
                const lenc = 2 + (wave + Math.sin(i + now*0.005))*1.8;
                targetCtx.beginPath();
                targetCtx.moveTo(px*0.9, py*0.9);
                targetCtx.lineTo(px*1.1 + (Math.cos(a+wave)*0.6), py*1.1 + (Math.sin(a+wave)*0.6));
                targetCtx.stroke();
            }
            targetCtx.fillStyle = 'rgba(8,12,10,0.54)';
            for(const o of e.organelles){
                targetCtx.beginPath();
                targetCtx.arc(o.ax*0.6, o.ay*0.6, o.r*0.8, 0, Math.PI*2);
                targetCtx.fill();
            }
        } else {
            targetCtx.fillStyle = grad;
            targetCtx.beginPath();
            targetCtx.arc(0,0,r,0,Math.PI*2);
            targetCtx.fill();
            targetCtx.strokeStyle = e.membraneTint;
            targetCtx.lineWidth = Math.max(0.8, r*0.08);
            targetCtx.stroke();
        }

        targetCtx.restore();
    }

    function drawPulses(){
        const now = Date.now();
        for(const p of pulses){
            const elapsed = (now - p.started) / 1000;
            const t = Math.min(1, Math.max(0, elapsed / p.duration));
            const radius = t * p.maxRadius;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = 0.9 * (1 - t);
            ctx.strokeStyle = `rgba(160, 240, 200, ${0.85 * (1 - t)})`;
            ctx.lineWidth = 3 + 3 * (1 - t);
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    // compute control value (0..1) based on elapsed game time
    function controlValue(now){
        if(!running) return CONTROL_FULL;
        const elapsed = (now - gameStartTime) / 1000;
        if(elapsed <= CONTROL_HOLD_SEC) return CONTROL_FULL;
        if(elapsed <= CONTROL_FADE_TO_SEC){
            // linear from HOLD -> MID
            const t = (elapsed - CONTROL_HOLD_SEC) / (CONTROL_FADE_TO_SEC - CONTROL_HOLD_SEC);
            return CONTROL_FULL + (CONTROL_MID - CONTROL_FULL) * t;
        }
        if(elapsed <= CONTROL_END_SEC){
            const t = (elapsed - CONTROL_FADE_TO_SEC) / (CONTROL_END_SEC - CONTROL_FADE_TO_SEC);
            return CONTROL_MID + (CONTROL_LOW - CONTROL_MID) * t;
        }
        return CONTROL_LOW;
    }

    // helper to pick a random integer in [min,max]
    function randInt(min, max){
        return Math.floor(Math.random()*(max-min+1)) + min;
    }

    function updateMicrobe(e, dt, now){
        // run / tumble base behavior - but we'll modulate timers with control and sticky
        if(e.motilityState === 'run'){
            e.runTimer -= dt;
            if(e.runTimer <= 0){
                e.motilityState = 'tumble';
                e.tumbleTimer = 0.08 + Math.random() * 0.28;
                const a = Math.random() * Math.PI * 2;
                e.direction.x = Math.cos(a);
                e.direction.y = Math.sin(a);
            }
        } else {
            e.tumbleTimer -= dt;
            if(e.tumbleTimer <= 0){
                e.motilityState = 'run';
                e.runTimer = 0.6 + Math.random() * 1.4;
                const a = Math.random() * Math.PI * 2;
                e.direction.x = Math.cos(a);
                e.direction.y = Math.sin(a);
            }
        }

        const dn = dayNightFactor();
        const night = (dn < 0.25 || dn > 0.75);
        let desired = { x: e.direction.x, y: e.direction.y };

        // social cohesion
        let comm = { x: 0, y: 0 };
        let nearby = 0;
        for(const o of microbes){
            if(o === e) continue;
            const dx = o.x - e.x;
            const dy = o.y - e.y;
            const dist = Math.hypot(dx, dy);
            if(dist > 0 && dist < e.communicationRadius){
                comm.x += (dx / dist) * 0.04;
                comm.y += (dy / dist) * 0.04;
                nearby++;
            }
        }
        if(nearby > 0){
            desired.x += comm.x;
            desired.y += comm.y;
        }

        // control value influences everything
        const nowControl = controlValue(now);

        // gradually re-assign response modes as control decreases (so individuality returns)
        // we only reassign occasionally to avoid jitter
        if(now - e.modeAssignedAt > 1200 && Math.random() < 0.12 && nowControl < 0.95){
            // bias toward ignore/repel as control drops
            const bias = 1 - nowControl; // 0..1
            const r = Math.random();
            if(r < 0.2 + bias * 0.55) e.responseMode = 'ignore';
            else if(r < 0.35 + bias * 0.6) e.responseMode = 'repel';
            else if(r < 0.6) e.responseMode = 'nightOnly';
            else e.responseMode = 'attract';
            e.modeAssignedAt = now;
        }

        // pulses influence
        let pulseInfluence = { x: 0, y: 0 };
        for(const p of pulses){
            const elapsed = (now - p.started) / 1000;
            if(elapsed < 0 || elapsed > p.duration) continue;

            const dx = p.x - e.x;
            const dy = p.y - e.y;
            const dist = Math.hypot(dx, dy) || 0.0001;
            const pulseRadius = elapsed / p.duration * p.maxRadius;
            if(dist > pulseRadius + 30) continue;
            if(now < e.ignorePulsesUntil) continue;

            // Determine willRespond: baseline per-microbe scaled by control (when control high, almost all respond)
            // Also add temporary boosts (firstClickBoost / helpBoost)
            let willRespondProb = RESPONSE_PROB_BASE * nowControl * (0.85 + (1 - e.individuality) * 0.3); // per-microbe individuality reduces chance slightly
            // mix in microbe base to avoid extreme outliers
            willRespondProb = Math.min(0.98, willRespondProb * (0.6 + e.responseProbBase*0.7));

            if(now < firstClickBoostUntil){
                // strong nudge on first click for those near pulse center so player sees immediate effect
                if(dist < p.maxRadius * 0.6) willRespondProb = Math.max(willRespondProb, 0.92);
            }
            if(now < helpBoostUntil){
                // temporary global help to push toward 9
                willRespondProb = Math.max(willRespondProb, 0.85);
            }

            // If control is high, ignore per-microbe responseMode and make them attract
            const effectiveMode = (nowControl > 0.7) ? 'attract' : e.responseMode;

            // apply night-only check if not in attract-high-control
            if(effectiveMode === 'nightOnly' && !night) continue;

            if(Math.random() >= willRespondProb) continue;

            // strength scaled by control and proximity and pulse phase
            const nx = dx / dist;
            const ny = dy / dist;
            const proximity = Math.max(0, 1 - (dist / Math.max(20, pulseRadius + 1)));
            const phaseFactor = 1 - (elapsed / p.duration);
            const baseStrength = (0.46 + (1 - e.individuality) * 0.18) * proximity * phaseFactor;
            const strength = baseStrength * (1 + nowControl * PULSE_STRENGTH_MULT);

            if(effectiveMode === 'repel'){
                pulseInfluence.x -= nx * strength;
                pulseInfluence.y -= ny * strength;
            } else {
                pulseInfluence.x += nx * strength;
                pulseInfluence.y += ny * strength;
            }
            e.lastRespondedAt = now;
        }

        desired.x += pulseInfluence.x * 2.6 + (Math.random() - 0.5) * 0.06;
        desired.y += pulseInfluence.y * 2.6 + (Math.random() - 0.5) * 0.06;

        // zone attraction; sticky behavior scales with control
        const dxz = zone.x - e.x;
        const dyz = zone.y - e.y;
        const distz = Math.hypot(dxz, dyz) || 0.0001;
        const inside = distz <= zone.radius + e.radius * 0.6;

        if(inside){
            // sticky strength scales with control plus any explicit stickyUntil timestamp
            const stickyActive = (now < e.stickyUntil) || nowControl > 0.6;
            if(stickyActive){
                // scale with control so it weakens as control falls
                const stickyStrength = STICKY_PULL_BASE * nowControl * (1 + (1 - e.individuality)*0.4);
                e.stickyStrength = Math.max(e.stickyStrength, stickyStrength);
                desired.x += (dxz / distz) * e.stickyStrength;
                desired.y += (dyz / distz) * e.stickyStrength;

                // slow them and reduce tumble frequency while sticky
                if(e.motilityState === 'run') e.runTimer += dt * (1.2 * (0.5 + nowControl * 0.9));
                if(Math.random() < 0.02 * (0.6 + nowControl * 0.7)) {
                    // occasional tiny adjustments rather than tumble
                }
            }

            // some natural resistance to leaving if just responded recently while control high
            if(now - e.lastRespondedAt < 2600 && nowControl > 0.55){
                e.stickyUntil = Math.max(e.stickyUntil, now + 2000 + Math.random()*1800);
            }
        }

        // Speed calculation
        const mag = Math.hypot(desired.x, desired.y) || 1;
        desired.x /= mag;
        desired.y /= mag;

        const rhythm = Math.sin(e.rhythmPhase + dn * Math.PI * 2);
        e.rhythmPhase += dt * (0.7 + dn * 1.2);
        let baseSpeed = Math.max(0.08, e.baseSpeed * (0.55 + 0.9 * (1 - Math.abs(0.5 - dn) * 2)) + Math.abs(rhythm) * 0.12);

        // modify base speed when sticky
        if(now < e.stickyUntil || e.stickyStrength > 0.01){
            // scale by current control to make sticky decay as control drops
            const stickyScale = Math.max(STICKY_SPEED_MULT, STICKY_SPEED_MULT * controlValue(now));
            baseSpeed *= stickyScale;
        }
        if(now < e.speedBurstUntil){
            baseSpeed *= 1.9 + Math.random()*0.6;
        }

        // last-phase randomness to push microbes out
        if((now - gameStartTime) > LAST_PHASE_START){
            if(Math.random() < 0.006 + (Math.hypot(e.x-zone.x, e.y-zone.y) / (zone.radius+e.radius))*0.02){
                const dx = e.x - zone.x;
                const dy = e.y - zone.y;
                const d = Math.hypot(dx,dy) || 0.0001;
                desired.x += (dx/d) * (0.28 + Math.random()*0.26);
                desired.y += (dy/d) * (0.28 + Math.random()*0.26);
            }
            // also reduce response probability gradually
            // handled elsewhere via controlValue
        }

        const moveScale = e.motilityState === 'run' ? 1 : 0.34;
        e.x += desired.x * baseSpeed * moveScale;
        e.y += desired.y * baseSpeed * moveScale;

        // keep inside canvas
        if(e.x - e.radius < 0){ e.x = e.radius; e.direction.x *= -1; }
        if(e.x + e.radius > canvas.width){ e.x = canvas.width - e.radius; e.direction.x *= -1; }
        if(e.y - e.radius < 0){ e.y = e.radius; e.direction.y *= -1; }
        if(e.y + e.radius > canvas.height){ e.y = canvas.height - e.radius; e.direction.y *= -1; }
    }

    function countInZone(){
        let inZone = 0;
        for(const e of microbes){
            const dx = e.x - zone.x;
            const dy = e.y - zone.y;
            const dist = Math.hypot(dx, dy);
            if(dist <= zone.radius + e.radius * 0.6){
                inZone++;
            }
        }
        return inZone;
    }

    // force a number of microbes to leave with parameters customizing how dramatic & long they ignore pulses
    function forceMicrobesLeave(n, opts = {}){
        const inside = microbes.filter(e => Math.hypot(e.x - zone.x, e.y - zone.y) <= zone.radius + e.radius*0.6);
        if(inside.length === 0) return;
        const shuffled = inside.slice();
        for(let i=shuffled.length-1;i>0;i--){
            const j = Math.floor(Math.random()*(i+1));
            const tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
        }
        const toTake = Math.min(n, shuffled.length);
        const now = Date.now();
        for(let i=0;i<toTake;i++){
            const e = shuffled[i];
            e.motilityState = 'run';
            // pick an outward-ish direction with some randomness
            const dx = e.x - zone.x;
            const dy = e.y - zone.y;
            const d = Math.hypot(dx,dy) || 0.0001;
            e.direction.x = (dx/d) + (Math.random()*0.8 - 0.4);
            e.direction.y = (dy/d) + (Math.random()*0.8 - 0.4);
            // longer speed burst if specified (or default)
            const burstMs = opts.burstMs || (600 + Math.random()*900);
            e.speedBurstUntil = now + burstMs;
            // ignore pulses for a long time so they don't immediately get pulled back
            const ignoreMs = opts.ignoreMs || (900 + Math.random()*1000);
            e.ignorePulsesUntil = now + ignoreMs;
            e.lastLeftZoneAt = now;
            // visual nudge outward
            const norm = Math.hypot(e.direction.x, e.direction.y) || 1;
            e.x += (e.direction.x / norm) * (8 + Math.random()*10);
            e.y += (e.direction.y / norm) * (8 + Math.random()*10);
        }
    }

    // special heavy-leave behavior used when 10th enters or betrayals: longer ignore and burst
    function heavyLeave(n){
        const opts = {
            burstMs: randInt(900, 1400),
            ignoreMs: randInt(BETRAY_IGNORE_MIN_MS, BETRAY_IGNORE_MAX_MS)
        };
        forceMicrobesLeave(n, opts);
    }

    // schedule betrayals when many are inside; but the new design uses explicit behaviours:
    function scheduleBetrayalIfNeeded(inZone){
        const now = Date.now();
        // keep old conservative scheduling but it's now less deterministic
        if(inZone >= 8){
            if(betrayalScheduledAt === 0 && (now - lastBetrayalTime > 2400)){
                betrayalScheduledAt = now + 400 + Math.random()*800;
            }
        }
        if(betrayalScheduledAt !== 0 && now >= betrayalScheduledAt){
            // small betrayal to keep things lively
            forceMicrobesLeave(1 + Math.floor(Math.random()*2));
            lastBetrayalTime = now;
            betrayalScheduledAt = 0;
        }
    }

    // If the player hasn't reached 9 by GUARANTEE_NINE_TIME_MS, give them a temporary help boost
    function maybeApplyHelpBoost(now){
        if(highestCount < 9 && (now - gameStartTime) > GUARANTEE_NINE_TIME_MS && now > helpBoostUntil){
            helpBoostUntil = now + BOOST_AFTER_TIMEOUT_MS;
        }
    }

    // If a 10th microbe enters, make a believable "they chose to leave" reaction
    function handleTenInsideNow(){
        const now = Date.now();
        // pick 1-2 microbes to do a quick run-and-tumble leave after a short delay
        const delay = randInt(TEN_RESPONSE_DELAY_MIN, TEN_RESPONSE_DELAY_MAX);
        setTimeout(() => {
            heavyLeave(1 + Math.floor(Math.random()*2));
        }, delay);
    }

    // handle hold at nine: when count reaches 9 for the first time hold for 1-2s to let player believe they will win
    function handleReachedNine(now){
        if(!reachedNineAt){
            reachedNineAt = now;
            reachedNineOnce = true;
            // set a small hold (we won't forcibly remove microbes during this hold)
            reachedNineHoldUntil = now + randInt(HOLD_AT_NINE_MIN_MS, HOLD_AT_NINE_MAX_MS);
        } else {
            // later times: schedule a betrayal of 2-3 microbes within 0.5-1.5s
            const delay = randInt(LATER_BETRAY_MIN_DELAY_MS, LATER_BETRAY_MAX_DELAY_MS);
            setTimeout(() => {
                heavyLeave(2 + Math.floor(Math.random()*2));
            }, delay);
        }
    }

    // keep a simple variable for the short hold after reaching 9
    let reachedNineHoldUntil = 0;
    let lastInZone = 0;

    function update(dt){
        if(!running || ended) return;

        const now = Date.now();

        // clean pulses
        for(let i = pulses.length - 1; i >= 0; i--){
            if(now - pulses[i].started > pulses[i].duration * 1000){
                pulses.splice(i, 1);
            }
        }

        // ensure help boost if needed
        maybeApplyHelpBoost(now);

        // update microbes
        for(const e of microbes){
            updateMicrobe(e, dt, now);
        }

        let inZone = countInZone();
        if(inZone > highestCount) highestCount = inZone;

        // check transitions for reaching 9
        if(inZone === (GOAL - 1) && lastInZone !== (GOAL - 1)){
            // just reached 9
            handleReachedNine(now);
        }

        // when a 10th enters: we must never allow it to stay long
        if(inZone >= GOAL){
            // if this just happened, trigger the believable leave sequence
            if(lastInZone < GOAL){
                handleTenInsideNow();
            }
            // ensure it never stays >= GOAL for more than 500ms
            setTimeout(() => {
                // re-check and force a small leave if still at/above goal
                const current = countInZone();
                if(current >= GOAL){
                    // push out enough so it's at most GOAL - 1
                    const extra = current - (GOAL - 1);
                    heavyLeave(Math.max(1, extra));
                }
            }, 450); // within 0.3-0.6s as spec'd (we pick 450ms)
        }

        // Schedule normal betrayals occasionally (keeps dynamism)
        scheduleBetrayalIfNeeded(inZone);

        // If the player hasn't reached 9 by about 26s, give a temporary boost until they do
        if((now - gameStartTime) > GUARANTEE_NINE_TIME_MS && highestCount < 9){
            // extend help window to encourage reaching 9
            helpBoostUntil = Math.max(helpBoostUntil, now + BOOST_AFTER_TIMEOUT_MS);
        }

        // Make sure there is never 10 inside for long (catch-all)
        inZone = countInZone();
        if(inZone >= GOAL){
            const extra = inZone - (GOAL - 1);
            heavyLeave(Math.max(1, extra));
        }

        // update HUD
        HUD.counterEl.textContent = `${inZone} / ${GOAL}`;

        // timer
        const timeLeft = Math.max(0, GAME_DURATION - (now - gameStartTime));
        HUD.timerEl.textContent = Math.ceil(timeLeft / 1000).toString();

        // end condition
        if((Date.now() - gameStartTime) >= GAME_DURATION){
            endGame();
        }

        lastInZone = inZone;
    }

    function draw(){
        const now = Date.now();
        drawBackground();
        drawPulses();
        const inZone = countInZone();
        drawZone(inZone);
        const sorted = microbes.slice().sort((a,b)=> a.y - b.y);
        for(const e of sorted){
            drawMicrobe(ctx, e, now);
        }

        ctx.save();
        ctx.translate(cursor.x, cursor.y);
        ctx.strokeStyle = 'rgba(230, 245, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10);
        ctx.stroke();
        ctx.restore();

        if(running && !ended){
            startHint.classList.remove('hidden');
            startHint.style.display = 'block';
        } else {
            startHint.classList.add('hidden');
            startHint.style.display = 'none';
        }
    }

    function createPulseAt(x, y){
        pulses.push({
            x: x,
            y: y,
            started: Date.now(),
            duration: PULSE_DURATION,
            maxRadius: PULSE_MAX_RADIUS
        });
        // first-click boost
        if(!firstClickBoostUntil || Date.now() > firstClickBoostUntil){
            // first click: ensure a short boost window so first pulse strongly affects neighbors
            firstClickBoostUntil = Date.now() + FIRST_CLICK_BOOST_MS;
        }
    }

    function startGame(){
        running = true;
        ended = false;
        gameStartTime = Date.now();
        lastTime = Date.now();
        pulses.length = 0;
        highestCount = 0;
        betrayalScheduledAt = 0;
        lastBetrayalTime = 0;
        reachedNineAt = 0;
        reachedNineOnce = false;
        firstClickBoostUntil = 0;
        helpBoostUntil = 0;
        reachedNineHoldUntil = 0;

        createPopulation(40);

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('summaryScreen').classList.add('hidden');
        startHint.classList.remove('hidden');
    }

    function endGame(){
        if(ended) return;
        ended = true;
        running = false;
        document.getElementById('summaryScreen').classList.remove('hidden');
        startHint.classList.add('hidden');
        document.getElementById('closestLine').textContent = `Closest: ${highestCount} of ${GOAL}`;
    }

    window.addEventListener('mousemove', (event) => {
        cursor.x = event.clientX;
        cursor.y = event.clientY;
    });

    window.addEventListener('pointerdown', (ev) => {
        if(!running) return;
        pointerDown = true;
        // immediate pulse
        createPulseAt(cursor.x, cursor.y);
        // start repeating pulses while held
        if(pointerPulseInterval) clearInterval(pointerPulseInterval);
        pointerPulseInterval = setInterval(() => {
            if(pointerDown){
                createPulseAt(cursor.x, cursor.y);
            }
        }, PULSE_INTERVAL_MS);
    });
    window.addEventListener('pointerup', (ev) => {
        pointerDown = false;
        if(pointerPulseInterval){
            clearInterval(pointerPulseInterval);
            pointerPulseInterval = null;
        }
    });

    window.addEventListener('pointermove', (event) => {
        cursor.x = event.clientX;
        cursor.y = event.clientY;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('tryAgainBtn').addEventListener('click', () => {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('summaryScreen').classList.add('hidden');
        startGame();
    });

    function loop(){
        const now = Date.now();
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => {
        resize();
        ensureZonePosition();
    });

    ensureZonePosition();
    createPopulation(40);
    requestAnimationFrame(loop);
    </script>
</body>
</html>
