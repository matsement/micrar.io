<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micrar.io - Unpredictable Microbe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
            display: none;
            border: 3px solid #ff0000;
        }

        #gameOver h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ff0000;
        }

        #gameOver p {
            font-size: 20px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #00ff00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #gameOver button:hover {
            background: #00cc00;
        }

        #branding {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #cccccc;
            z-index: 100;
            text-shadow: 0 1px 0 rgba(0,0,0,0.8);
        }

        #branding .title {
            font-weight: bold;
            color: #ffffff;
            font-size: 16px;
        }

        #branding .subtitle {
            font-size: 12px;
            color: #dddddd;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Size: <span id="size">10</span></div>
    </div>

    <div id="branding">
        <div class="title">Micrar.io</div>
        <div class="subtitle">The unpredictable microbe game</div>
    </div>

    <div id="gameOver">
        <h1>GAME OVER!</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Final Size: <span id="finalSize">0</span></p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            speed: 3,
            score: 0,
            alive: true,
            opacity: 0.9,
            type: null,
            color: '#00ff88'
        };

        let particles = [];
        let enemies = [];

        const directions = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        let controlMap = {
            'w': 'UP',
            'a': 'LEFT',
            's': 'DOWN',
            'd': 'RIGHT'
        };

        let keys = {};
        let currentDirection = { x: 0, y: 0 };
        let controlChangeTimer = 10;

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 3,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    opacity: 0.8
                });
            }
        }

        const microbeTypes = ['spiky', 'rod', 'coccus', 'flagella'];

        function randomMicrobeType() {
            return microbeTypes[Math.floor(Math.random() * microbeTypes.length)];
        }

        function createEnemies(count) {
            for (let i = 0; i < count; i++) {
                enemies.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 8 + Math.random() * 18,
                    speed: 0.6 + Math.random() * 1.6,
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                    directionChangeTimer: 0,
                    direction: { x: Math.random() - 0.5, y: Math.random() - 0.5 },
                    rhythmPhase: Math.random() * Math.PI * 2,
                    opacity: 0.65 + Math.random() * 0.35,
                    communicationRadius: 80 + Math.random() * 40,
                    type: randomMicrobeType()
                });
            }
        }

        function randomizeControls() {
            const directionOrder = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
            const shuffled = [...directionOrder].sort(() => Math.random() - 0.5);
            controlMap = {
                'w': shuffled[0],
                'a': shuffled[1],
                's': shuffled[2],
                'd': shuffled[3]
            };
            controlChangeTimer = 10;
        }

        function updatePlayerDirection() {
            currentDirection = { x: 0, y: 0 };
            if (keys['w']) {
                const dir = directions[controlMap['w']];
                currentDirection.x += dir.x;
                currentDirection.y += dir.y;
            }
            if (keys['a']) {
                const dir = directions[controlMap['a']];
                currentDirection.x += dir.x;
                currentDirection.y += dir.y;
            }
            if (keys['s']) {
                const dir = directions[controlMap['s']];
                currentDirection.x += dir.x;
                currentDirection.y += dir.y;
            }
            if (keys['d']) {
                const dir = directions[controlMap['d']];
                currentDirection.x += dir.x;
                currentDirection.y += dir.y;
            }
            const magnitude = Math.sqrt(currentDirection.x ** 2 + currentDirection.y ** 2);
            if (magnitude > 0) {
                currentDirection.x /= magnitude;
                currentDirection.y /= magnitude;
            }
        }

        function update(deltaTime) {
            controlChangeTimer -= deltaTime;
            if (controlChangeTimer <= 0) {
                randomizeControls();
            }

            updatePlayerDirection();
            player.x += currentDirection.x * player.speed;
            player.y += currentDirection.y * player.speed;

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                const dx = player.x - p.x;
                const dy = player.y - p.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + p.radius) {
                    player.radius += 0.3;
                    player.score += 1;
                    particles.splice(i, 1);
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: 3,
                        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                        opacity: 0.8
                    });
                }
            }

            enemies.forEach((enemy, index) => {
                enemy.rhythmPhase += deltaTime * 2;
                const rhythmInfluence = Math.sin(enemy.rhythmPhase) * 0.3;
                enemy.directionChangeTimer--;

                let communicationEffect = { x: 0, y: 0 };
                for (let other of enemies) {
                    if (other !== enemy) {
                        const dx = other.x - enemy.x;
                        const dy = other.y - enemy.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < enemy.communicationRadius && distance > 0) {
                            communicationEffect.x += dx / distance * 0.05;
                            communicationEffect.y += dy / distance * 0.05;
                        }
                    }
                }

                if (enemy.directionChangeTimer <= 0) {
                    enemy.direction = {
                        x: Math.random() - 0.5 + communicationEffect.x,
                        y: Math.random() - 0.5 + communicationEffect.y
                    };
                    const magnitude = Math.sqrt(enemy.direction.x ** 2 + enemy.direction.y ** 2);
                    if (magnitude > 0) {
                        enemy.direction.x /= magnitude;
                        enemy.direction.y /= magnitude;
                    }
                    enemy.directionChangeTimer = 60 + Math.random() * 120;
                }

                enemy.x += (enemy.direction.x + rhythmInfluence) * enemy.speed;
                enemy.y += (enemy.direction.y + rhythmInfluence) * enemy.speed;

                if (enemy.x - enemy.radius < 0 || enemy.x + enemy.radius > canvas.width) {
                    enemy.direction.x *= -1;
                    enemy.x = Math.max(enemy.radius, Math.min(canvas.width - enemy.radius, enemy.x));
                }
                if (enemy.y - enemy.radius < 0 || enemy.y + enemy.radius > canvas.height) {
                    enemy.direction.y *= -1;
                    enemy.y = Math.max(enemy.radius, Math.min(canvas.height - enemy.radius, enemy.y));
                }

                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + enemy.radius) {
                    if (player.radius > enemy.radius) {
                        player.radius += enemy.radius * 0.5;
                        player.score += Math.floor(enemy.radius);
                        enemies.splice(index, 1);
                    } else {
                        gameEnd();
                    }
                }
            });

            document.getElementById('score').textContent = player.score;
            document.getElementById('size').textContent = Math.round(player.radius);
        }

        function drawMicrobe(targetCtx, x, y, r, type, color, opacity) {
            targetCtx.save();
            targetCtx.translate(x, y);
            targetCtx.globalAlpha = opacity;

            if (type === 'spiky') {
                targetCtx.fillStyle = color;
                targetCtx.beginPath();
                targetCtx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
                targetCtx.fill();

                const spikes = 10 + Math.floor(r / 3);
                for (let i = 0; i < spikes; i++) {
                    const a = (i / spikes) * Math.PI * 2;
                    const sx = Math.cos(a) * (r * 0.9);
                    const sy = Math.sin(a) * (r * 0.9);
                    targetCtx.beginPath();
                    targetCtx.moveTo(sx, sy);
                    const ex = Math.cos(a) * (r * 1.5);
                    const ey = Math.sin(a) * (r * 1.5);
                    targetCtx.lineTo(ex, ey);
                    targetCtx.lineWidth = Math.max(1, r * 0.08);
                    targetCtx.strokeStyle = color;
                    targetCtx.stroke();
                }
            } else if (type === 'rod') {
                targetCtx.fillStyle = color;
                const w = r * 1.6;
                const h = r * 0.8;
                targetCtx.beginPath();
                targetCtx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
                targetCtx.fill();

                targetCtx.strokeStyle = color;
                targetCtx.lineWidth = Math.max(1, r * 0.07);
                for (let i = 0; i < 3; i++) {
                    const off = -h / 2 + i * (h / 1.5);
                    targetCtx.beginPath();
                    targetCtx.moveTo(-w / 2 + 4, off);
                    targetCtx.bezierCurveTo(-w / 2 - r, off - 6, -w / 2 - r, off + 10, -w / 2 - (r * 1.2), off + 14);
                    targetCtx.stroke();
                }
            } else if (type === 'coccus') {
                const count = 4 + Math.floor(r / 4);
                targetCtx.fillStyle = color;
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const rr = Math.random() * r * 0.6;
                    targetCtx.beginPath();
                    targetCtx.arc(Math.cos(a) * rr, Math.sin(a) * rr, r * 0.45, 0, Math.PI * 2);
                    targetCtx.fill();
                }
            } else if (type === 'flagella') {
                targetCtx.fillStyle = color;
                targetCtx.beginPath();
                targetCtx.ellipse(0, 0, r * 0.9, r * 0.5, 0, 0, Math.PI * 2);
                targetCtx.fill();

                targetCtx.strokeStyle = color;
                targetCtx.lineWidth = Math.max(1, r * 0.05);
                for (let i = 0; i < 5; i++) {
                    const off = -r * 0.35 + i * (r * 0.17);
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.9, off);
                    targetCtx.quadraticCurveTo(r * 1.5 + Math.random() * r, off + (Math.random() - 0.5) * r, r * 1.9 + Math.random() * r, off + 10 + Math.random() * 10);
                    targetCtx.stroke();
                }
            } else {
                targetCtx.fillStyle = color;
                targetCtx.beginPath();
                targetCtx.arc(0, 0, r, 0, Math.PI * 2);
                targetCtx.fill();
            }

            targetCtx.globalAlpha = 0.25;
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = Math.max(1, r * 0.06);
            targetCtx.beginPath();
            targetCtx.arc(0, 0, r, 0, Math.PI * 2);
            targetCtx.stroke();

            targetCtx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#1e3c72');
            grad.addColorStop(1, '#2a5298');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            enemies.forEach(enemy => {
                drawMicrobe(ctx, enemy.x, enemy.y, enemy.radius, enemy.type, enemy.color, enemy.opacity);
            });

            if (!player.type) {
                player.type = randomMicrobeType();
            }
            drawMicrobe(ctx, player.x, player.y, player.radius, player.type, player.color, player.opacity);
        }

        function gameEnd() {
            player.alive = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = player.score;
            document.getElementById('finalSize').textContent = Math.round(player.radius);
        }

        let lastTime = Date.now();
        function gameLoop() {
            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (player.alive) {
                update(deltaTime);
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        createParticles(200);
        createEnemies(12);
        randomizeControls();
        gameLoop();
    </script>
</body>
</html>
